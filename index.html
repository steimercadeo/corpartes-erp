<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORPARTES ERP</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}
#app{width:100%;height:100%;border:0;display:block;background:#fff}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-family:Arial,sans-serif;color:#0f405f;background:#f8fafc;z-index:10}
#boot.hidden{display:none}
</style>
</head>
<body>
<div id="boot">Cargando CORPARTES ERP…</div>
<iframe id="app" src="/app.html" title="CORPARTES ERP"></iframe>
<script>
(function(){
 const frame=document.getElementById('app');
 const boot=document.getElementById('boot');
 const reprocessCss=`
 #orders-tab-reprocesos .cp-rp-zone{background:linear-gradient(180deg,#f4f8ff 0%,#fff 100%)!important;border:1px solid #c8dcff!important;border-radius:22px!important;padding:20px!important;margin-top:4px!important;box-shadow:0 10px 28px rgba(37,99,235,.07)!important}
 #orders-tab-reprocesos .cp-rp-zone>label{display:block!important;font-size:16px!important;font-weight:900!important;color:#173f70!important;margin:0 0 4px!important}
 #orders-tab-reprocesos .cp-rp-zone>small{display:block!important;color:#64748b!important;margin-top:12px!important;line-height:1.5!important}
 #orders-tab-reprocesos #reprocessProcessChecks{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important;margin-top:14px!important}
 #orders-tab-reprocesos #reprocessProcessChecks label{min-height:82px!important;border:1px solid #d7e4f7!important;border-radius:16px!important;background:#fff!important;padding:15px 16px!important;display:flex!important;align-items:center!important;gap:13px!important;cursor:pointer!important;box-shadow:0 5px 14px rgba(15,23,42,.04)!important;transition:.16s ease!important}
 #orders-tab-reprocesos #reprocessProcessChecks label:hover{border-color:#8bb8ff!important;transform:translateY(-1px)!important;box-shadow:0 9px 22px rgba(37,99,235,.10)!important}
 #orders-tab-reprocesos #reprocessProcessChecks label.cp-rp-selected{border:2px solid #2563eb!important;background:#eef5ff!important;box-shadow:0 12px 26px rgba(37,99,235,.13)!important}
 #orders-tab-reprocesos #reprocessProcessChecks input[type=checkbox]{appearance:none!important;-webkit-appearance:none!important;width:25px!important;height:25px!important;min-width:25px!important;border:2px solid #9aa9bb!important;border-radius:8px!important;background:#fff!important;margin:0!important;display:grid!important;place-items:center!important}
 #orders-tab-reprocesos #reprocessProcessChecks input[type=checkbox]:checked{background:#2563eb!important;border-color:#2563eb!important}
 #orders-tab-reprocesos #reprocessProcessChecks input[type=checkbox]:checked:after{content:"✓";color:white;font-size:15px;font-weight:900}
 #orders-tab-reprocesos #reprocessProcessChecks .chip{min-height:42px!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;padding:9px 15px!important;border-radius:999px!important;font-size:14px!important;font-weight:900!important;line-height:1.15!important;box-shadow:0 6px 14px rgba(15,23,42,.09)!important}
 #orders-tab-reprocesos .reprocess-builder{border:1px solid #dbeafe!important;border-radius:18px!important;padding:17px!important;background:#fbfdff!important}
 #orders-tab-reprocesos .reprocess-add-row{background:#fff!important;border-radius:14px!important;padding:12px!important;border:1px solid #edf2f7!important}
 @media(max-width:900px){#orders-tab-reprocesos #reprocessProcessChecks{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
 @media(max-width:650px){#orders-tab-reprocesos #reprocessProcessChecks{grid-template-columns:1fr!important}}
 `;
 function applyHardFix(d){
   if(!d||!d.head||!d.body)return;
   if(!d.getElementById('cp-rp-hard-style')){
     const st=d.createElement('style');st.id='cp-rp-hard-style';st.textContent=reprocessCss;d.head.appendChild(st);
   }
   const zone=d.getElementById('reprocessProcessChecks');
   if(zone){
     const field=zone.closest('.field');
     if(field){
       field.classList.add('cp-rp-zone');
       const direct=[...field.children].find(x=>x.tagName==='LABEL');
       if(direct)direct.textContent='Selecciona las etapas del reproceso';
       const helper=[...field.children].find(x=>x.tagName==='SMALL');
       if(helper)helper.textContent='Marca una o varias etapas. El costo del reproceso se calcula una sola vez por pieza, aunque intervengan varios procesos.';
     }
     zone.querySelectorAll('label').forEach(label=>{
       const input=label.querySelector('input[type=checkbox]');
       if(!input)return;
       label.classList.toggle('cp-rp-selected',input.checked);
       if(!input.dataset.cpHardBound){
         input.dataset.cpHardBound='1';
         input.addEventListener('change',()=>label.classList.toggle('cp-rp-selected',input.checked));
       }
     });
   }
 }
 frame.addEventListener('load',()=>{
   try{
     const d=frame.contentDocument;
     if(!d)return;
     const css=d.createElement('link');css.rel='stylesheet';css.href='/custom-v1.css?v=3';d.head.appendChild(css);
     const js=d.createElement('script');js.src='/custom-v1.js?v=3';js.defer=true;d.body.appendChild(js);
     applyHardFix(d);
     const mo=new MutationObserver(()=>applyHardFix(d));
     mo.observe(d.body,{childList:true,subtree:true});
     setTimeout(()=>applyHardFix(d),250);
     setTimeout(()=>applyHardFix(d),1000);
     boot.classList.add('hidden');
   }catch(e){boot.textContent='No fue posible iniciar CORPARTES ERP';}
 });
})();
</script>
</body>
</html>
