<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORPARTES ERP</title><style>html,body{margin:0;min-height:100%;background:#f8fafc;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#0f405f}</style></head><body><div class="boot">Cargando CORPARTES ERP…</div><script>
(async()=>{try{
 const r=await fetch('/app.html',{cache:'no-store'}); if(!r.ok) throw new Error('No se pudo cargar la aplicación');
 let html=await r.text();
 html=html.replace('</head>','<link rel="stylesheet" href="/reprocess-v3.css?v=1"></head>');
 html=html.replace('</body>','<script src="/reprocess-v3.js?v=1"><\/script></body>');
 document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div style="padding:32px;font-family:Arial;color:#991b1b"><h2>No fue posible iniciar CORPARTES ERP</h2><p>'+String(e.message||e)+'</p></div>';}})();
</script></body></html>
