<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CORPARTES ERP–CRM | Vista de pruebas aislada</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;font-family:Arial,Helvetica,sans-serif;color:#153657}
header{padding:13px 22px;background:#112f51;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header strong{font-size:15px}
header span{font-size:12px;color:#d3e7f6}
main{min-height:calc(100vh - 58px)}
#access{min-height:calc(100vh - 58px);display:grid;place-items:center;padding:25px}
.card{width:min(420px,100%);background:#fff;padding:26px;border-radius:18px;box-shadow:0 20px 55px #16355722}
h1{font-size:27px;margin:7px 0 8px}p{font-size:13px;line-height:1.55;color:#64748b}
label{display:block;margin:13px 0;font-size:12px;font-weight:700}
input{display:block;width:100%;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
button{padding:12px 15px;border:0;border-radius:9px;background:#165e92;color:#fff;font-weight:800;cursor:pointer}
.card button{width:100%;margin-top:8px}
#err{color:#bc2135;min-height:20px}
#work{display:none}
#demoFrame{border:0;width:100%;height:calc(100vh - 145px);background:#fff}#demoQuickNav button{background:#e4eff8;color:#164b75;font-size:11px;padding:8px 11px;border:1px solid #cde2f4}#demoQuickNav button:hover{background:#145d88;color:#fff}
.notice{font-size:12px;color:#ffe7aa}
#exit{display:none;background:#fff;color:#16385b}
@media(max-width:680px){header{padding:10px 13px}#demoFrame{height:calc(100vh - 205px)}}
</style>
</head>
<body>
<header><div><strong>CORPARTES ERP–CRM · DEMO</strong><div><span>Entorno aislado · Datos de ejemplo · Sin Firebase y sin envío de mensajes</span></div></div><button id="exit" type="button">Salir de demo</button></header>
<main>
  <section id="access">
    <form id="demoLogin" class="card">
      <small>VISTA DE DESARROLLO</small>
      <h1>Acceso de prueba</h1>
      <p>Revisa las pantallas originales del ERP con registros de ejemplo. No se consultan ni modifican pedidos reales.</p>
      <label>Usuario<input id="demoUser" autocomplete="off" required placeholder="DEMO"></label>
      <label>Clave<input id="demoPassword" type="password" autocomplete="off" required placeholder="Clave de demostración"></label>
      <button type="submit" id="enter">Ingresar al ERP de prueba</button>
      <p role="alert" id="err"></p>
    </form>
  </section>
  <section id="work">
 <nav id="demoQuickNav" aria-label="Nuevos módulos de Corpartes" style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px;background:#fff;border-bottom:2px solid #bad6eb">
  <strong style="font-size:12px;margin-right:5px">NUEVO EN CORPARTES OS</strong>
  <button type="button" data-demo-module="control">Centro de Control</button>
  <button type="button" data-demo-module="atlas">Atlas 360</button>
  <button type="button" data-demo-module="mercadeo">Mercadeo</button>
  <button type="button" data-demo-module="logistica">Logística</button>
  <button type="button" data-demo-module="fiscal">Colombia / DIAN</button>
  <button type="button" data-demo-module="conocimiento">Aprendizajes IA</button>
  <button type="button" data-demo-module="ai">IA + Chat interno</button>
  <span id="demoModulesReady" style="font-size:11px;color:#5a6b7c">Preparando módulos…</span>
 </nav>
 <iframe id="demoFrame" title="CORPARTES ERP, demo aislada" sandbox="allow-scripts allow-forms allow-modals allow-downloads" referrerpolicy="no-referrer"></iframe>
 </section>
</main>
<script>
/* Este acceso nunca autentica usuarios reales. La clave es pública y no protege datos. */
(function(){
  "use strict";
  const USER="DEMO",PASSWORD="Corpartes2026!";
  const login=document.getElementById("demoLogin");
  const error=document.getElementById("err"),frame=document.getElementById("demoFrame");
  const button=document.getElementById("enter");
  const originalInit="async function init(){\n  loadData();";
  const demoInit="async function init(){\n"+
    "  if(window.__CORPARTES_OFFLINE_DEMO__){\n"+
    "    state.data=seedData();\n"+
    "    ensureV15Data();\n"+
    "    bindEvents();bindV15ExtraEvents();\n"+
    "    state.currentUser=state.data.users.find(u=>u.code==='ADM01');\n"+
    "    nativeCloudReady=false;\n"+
    "    setCloudStatus('offline','Demo: datos de ejemplo');\n"+
    "    showApp();setTimeout(function(){try{var active=document.querySelector('.nav-button.active');if(!active||active.dataset.module==='inicio')openModule('control');}catch(_e){}},650);return;\n"+
    "  }\n  loadData();";
  const neededModules=["corpartes-ai-v1.js","corpartes-crm-v1.js","corpartes-os-v2.js",
    "corpartes-enterprise-v3.js","corpartes-manufacturing-v4.js",
    "corpartes-crm-playbooks-v1.js","corpartes-operations-v5.js","corpartes-knowledge-v6.js"];
  async function getModules(){
    const rows=await Promise.all(neededModules.map(async function(name){
      const res=await fetch("/"+name,{cache:"no-store",credentials:"same-origin"});
      if(!res.ok)throw new Error("No se pudo cargar "+name+" (HTTP "+res.status+").");
      return [name,await res.text()];
    }));
    return Object.fromEntries(rows);
  }
  function inlineJs(code){
    // Evita que un cierre de script dentro del archivo rompa el iframe.
    return "<script>"+code.replaceAll("</"+"script","<\\/"+"script")+"<\/script>";
  }
  const demoHead='<base href="/">\n'+
    '<script>window.__CORPARTES_OFFLINE_DEMO__=true;'+
    'window.openEditOrder=function(){window.alert("La edición de pedidos reales no está disponible en DEMO.");};'+
    'window.fetch=(function(orig){return function(input,options){'+
    'var method=String(options&&options.method||input&&input.method||"GET").toUpperCase();'+
    'if(method!=="GET"&&method!=="HEAD")return Promise.reject(new Error("Demo: no hay envíos ni escritura remota"));'+
    'return orig.apply(this,arguments);};})(window.fetch);'+
    '<\/script>';
  function transformOriginal(html,modules){
    if(!html.includes('id="loginView"')||!html.includes(originalInit)||!html.includes('<\/head>')){
      throw new Error("El archivo principal del ERP cambió o no pudo cargarse.");
    }
    // El bundle Firebase no se ejecuta en una demo con credenciales públicas.
    const firebaseBlock=/<script>\/\* CORPARTES ERP V0\.2\.1 · Firebase bundle embebido para apertura local \*\/[\s\S]*?<\/script>/;
    if(!firebaseBlock.test(html))throw new Error("No se pudo aislar Firebase del ERP.");
    html=html.replace(firebaseBlock,"<!-- Firebase deshabilitado: demo aislada -->");
    html=html.replace(originalInit,demoInit);
    // Inicialización anticipada de datos ficticios antes de listeners heredados.
    html=html.replace('const $ = (id) => document.getElementById(id);',
      'if(window.__CORPARTES_OFFLINE_DEMO__)state.data=seedData();\nconst $ = (id) => document.getElementById(id);');
    html=html.replace('if(!("serviceWorker" in navigator)) return;',
      'if(window.__CORPARTES_OFFLINE_DEMO__||!("serviceWorker" in navigator)) return;');
    html=html.replace('if ("serviceWorker" in navigator && location.protocol !== "file:")',
      'if (!window.__CORPARTES_OFFLINE_DEMO__ && "serviceWorker" in navigator && location.protocol !== "file:")');

    // Sin Service Worker dentro de un iframe de origen opaco (evita SecurityError).
    html=html.replace('if("serviceWorker" in navigator&&location.protocol!=="file:"){','if(!window.__CORPARTES_OFFLINE_DEMO__ && "serviceWorker" in navigator&&location.protocol!=="file:"){');
    for(const name of neededModules.slice(0,5)){
      const tag='<script src="./'+name+'"><\/script>';
      if(!html.includes(tag))throw new Error("Falta módulo original "+name);
      html=html.replace(tag,inlineJs(modules[name]));
    }
    // La demo no guarda en las claves localStorage usadas por el ERP real.
    html=html.replace("function saveData() {\n", "function saveData() {\n  if(window.__CORPARTES_OFFLINE_DEMO__)return;\n");
    html=html.replace("function backupLocalData() {\n", "function backupLocalData() {\n  if(window.__CORPARTES_OFFLINE_DEMO__)return;\n");
    // No se reutiliza el almacenamiento del ERP principal: iframe con origen aislado.
    html=html.replace("</head>",demoHead+"\n</head>");
    // El archivo arrastra scripts de feedback tras el cierre HTML; no incluirlos en la vista.
    const lastClose=html.lastIndexOf("</html>");
    if(lastClose!==-1)html=html.slice(0,lastClose+7);
    const extra=["corpartes-crm-playbooks-v1.js","corpartes-operations-v5.js","corpartes-knowledge-v6.js"]
      .map(function(name){return inlineJs(modules[name]);}).join("\n");
    const handshake=inlineJs("(function(){window.addEventListener('message',function(e){"+
      "if(e.source!==window.parent||!e.data||e.data.kind!=='corpartes-demo-open')return;"+
      "var id=String(e.data.module||'');if(!/^(control|atlas|mercadeo|logistica|fiscal|conocimiento|ai|crm|compras|contabilidad)$/.test(id))return;"+
      "if(typeof openModule==='function')openModule(id);"+
      "});document.addEventListener('DOMContentLoaded',function(){var ids=['control','atlas','mercadeo','logistica','fiscal','conocimiento','ai'];"+
      "window.parent.postMessage({kind:'corpartes-demo-loaded',visible:ids.filter(function(k){return !!document.getElementById('module-'+k)})},'*');"+
      "});})();");
    const endBody=html.lastIndexOf("</body>");
    if(endBody<0)throw new Error("No se encontró cierre del ERP.");
    html=html.slice(0,endBody)+extra+"\n"+handshake+"\n"+html.slice(endBody);
    return html;
  }
  document.getElementById("demoQuickNav").addEventListener("click",function(ev){
    const b=ev.target.closest("[data-demo-module]");
    if(!b||!frame.contentWindow)return;
    frame.contentWindow.postMessage({kind:"corpartes-demo-open",module:b.dataset.demoModule},"*");
  });
  window.addEventListener("message",function(ev){
    if(ev.source!==frame.contentWindow||!ev.data||ev.data.kind!=="corpartes-demo-loaded")return;
    const found=ev.data.visible||[];
    document.getElementById("demoModulesReady").textContent=found.length+" de 7 módulos de revisión cargados";
    document.getElementById("demoModulesReady").style.color=found.length===7?"#138253":"#9b4c16";
  });
  login.addEventListener("submit",async function(event){
    event.preventDefault();
    if(document.getElementById("demoUser").value.trim().toUpperCase()!==USER ||
       document.getElementById("demoPassword").value!==PASSWORD){
      error.textContent="Usuario o clave de demostración incorrectos.";return;
    }
    button.disabled=true;button.textContent="Abriendo el ERP...";
    error.textContent="";
    try{
      const response=await fetch("/index.html",{cache:"no-store",credentials:"same-origin"});
      if(!response.ok)throw new Error("El servidor no permitió obtener el ERP (HTTP "+response.status+").");
      const [html,modules]=await Promise.all([response.text(),getModules()]);
      frame.srcdoc=transformOriginal(html,modules);
      document.getElementById("access").style.display="none";
      document.getElementById("work").style.display="block";
      document.getElementById("exit").style.display="block";
    }catch(ex){error.textContent=ex.message||"Error abriendo la demostración.";}
    finally{button.disabled=false;button.textContent="Ingresar al ERP de prueba";}
  });
  document.getElementById("exit").addEventListener("click",function(){
    frame.removeAttribute("srcdoc");frame.src="about:blank";
    document.getElementById("work").style.display="none";
    document.getElementById("access").style.display="";
    document.getElementById("exit").style.display="none";
    document.getElementById("demoPassword").value="";
  });
})();
</script>
</body>
</html>
