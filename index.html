<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CORPARTES ERP</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}
#app{width:100%;height:100%;border:0;display:block;background:#fff}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-family:Arial,sans-serif;color:#0f405f;background:#f8fafc;z-index:10}
#boot.hidden{display:none}
</style>
</head>
<body>
<div id="boot">Cargando CORPARTES ERP…</div>
<iframe id="app" src="/app.html" title="CORPARTES ERP"></iframe>
<script>
(function(){
 const frame=document.getElementById('app');
 const boot=document.getElementById('boot');
 frame.addEventListener('load',()=>{
   try{
     const d=frame.contentDocument;
     if(!d)return;
     const css=d.createElement('link');css.rel='stylesheet';css.href='/custom-v1.css?v=1';d.head.appendChild(css);
     const js=d.createElement('script');js.src='/custom-v1.js?v=1';js.defer=true;d.body.appendChild(js);
     boot.classList.add('hidden');
   }catch(e){boot.textContent='No fue posible iniciar CORPARTES ERP';}
 });
})();
</script>
</body>
</html>
